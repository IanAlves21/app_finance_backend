services:
    # O banco de dados exclusivo do serviço de transações
    service-transactions:
        image: postgres:15-alpine
        container_name: service_transactions_db
        restart: always
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: service_transactions_db
        ports:
            - "5432:5432"
        volumes:
            - service_transactions_pgdata:/var/lib/postgresql/data

    # A sua interface de administração (PgAdmin)
    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin_tools
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - "5050:80"
        depends_on:
            - service-transactions # Agora ele espera o banco novo subir

    # Mensageria para Sincronização e Comunicação Assíncrona (RabbitMQ)
    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: finance_rabbitmq
        restart: always
        ports:
            - "5672:5672"
            - "15672:15672"

volumes:
    # Volume renomeado para não dar conflito com bancos antigos
    service_transactions_pgdata:
