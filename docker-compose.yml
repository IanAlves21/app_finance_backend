services:
    # ------------------------------------------------------------
    # BANCO DE DADOS POSTGRESQL (Multi-Database)
    # ------------------------------------------------------------
    service-transactions:
        image: postgres:15-alpine
        container_name: service_transactions_db
        restart: always
        environment:
            POSTGRES_USER: ${DB_USER:-root}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
            POSTGRES_DB: service_transactions_db
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - service_transactions_pgdata:/var/lib/postgresql/data
            - ./init-scripts:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-root} -d service_transactions_db",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    # ------------------------------------------------------------
    # PGADMIN (Interface de visualização do Postgres)
    # ------------------------------------------------------------
    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin_tools
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
        ports:
            - "${PGADMIN_PORT:-5050}:80"
        depends_on:
            service-transactions:
                condition: service_healthy

    # ------------------------------------------------------------
    # MENSAGERIA RABBITMQ
    # ------------------------------------------------------------
    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: finance_rabbitmq
        restart: always
        ports:
            - "${RABBITMQ_PORT:-5672}:5672"
            - "${RABBITMQ_MGMT_PORT:-15672}:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

